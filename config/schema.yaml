---
dataset_id:
  type: 'String'
  required: true
  help: 'Cohort identifier'
quantification_mode:
  type: 'String'
  choices: ['TMT', 'LFQ']
  required: true
  help: 'DDA quantification mode'
channel_csv:
  type: 'Path'
  mode: 'r'
  required: false
  help: 'TMT plex_id,channel,description CSV; required for TMT'
assay_mapping_csv:
  type: 'Path'
  mode: 'r'
  required: false
  help: 'Optional explicit level,abundance_column,sample_name,fraction_id,reporter_channel,group mapping'
mzml_csv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'Root metapipeline input CSV with sample_name,fraction_id,path'
search_idxml_csv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'Published validation.csv with sample_name,search_engine,idXML'
filtered_idxml_csv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'Published quant-idxml.csv with plex_id,idXML for TMT or sample_name,idXML for LFQ'
psm_features_csv:
  type: 'Path'
  mode: 'r'
  required: false
  help: 'Optional sample_name,search_engine,route,fraction_id,path manifest for published MSBooster PIN or PSMFeatureExtractor idXML files'
inference_route:
  type: 'String'
  choices: ['ProteinProphet', 'ProteinInferencer']
  required: true
  help: 'Cohort protein inference route'
protein_groups:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'Cohort converted ProteinProphet idXML or ProteinInferencer consensusXML'
protein_quant_csv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'ProteinQuantifier protein abundance table'
peptide_quant_csv:
  type: 'Path'
  mode: 'r'
  required: true
  help: 'ProteinQuantifier peptide abundance table'
output_dir:
  type: 'Path'
  mode: 'w'
  required: true
  help: 'Root output directory'
docker_image_plotly:
  type: 'String'
  required: false
  help: 'Public image with Plotly installed'
pyopenms_version:
  type: 'String'
  required: false
  help: 'Lab pyOpenMS container version'
work_dir:
  type: 'Path'
  mode: 'w'
  required: false
  help: 'Nextflow work directory'
base_resource_update:
  type: 'ResourceUpdateNamespace'
  required: false
  help: 'Process resource overrides'
  elements:
    memory:
      type: 'ResourceUpdateList'
      required: false
    cpus:
      type: 'ResourceUpdateList'
      required: false
